<!doctype html><html lang=ar dir=rtl><head><meta charset=utf-8><title>MikroTik Manager</title><meta name=viewport content="width=device-width,initial-scale=1">
<style>
:root{--bg:#0e1a1d;--pn:#152428;--ln:#253b40;--tx:#e5efee;--mu:#86a1a2;--ok:#3ddc97;--bad:#ff6b5b;--wr:#f5b942;--ac:#4cc9f0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.6 "Segoe UI",Tahoma,sans-serif;display:flex;height:100vh}
nav{width:200px;background:#0a1316;border-left:1px solid var(--ln);padding:14px 10px;display:flex;flex-direction:column;gap:4px}
nav b{font-size:16px;padding:4px 10px 12px}nav button{background:none;border:0;color:var(--mu);text-align:right;padding:9px 12px;border-radius:8px;font:inherit;cursor:pointer}
nav button.on{background:var(--pn);color:var(--tx);box-shadow:inset -3px 0 var(--ac)}nav button:hover{color:var(--tx)}
#st{margin-top:auto;padding:10px;font-size:12px;color:var(--mu)}main{flex:1;overflow:auto;padding:20px 24px}
section{display:none}section.on{display:block}h2{margin:0 0 14px;font-size:20px}h3{margin:0 0 10px;font-size:14px;color:var(--mu);font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px}
.card,.panel{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:14px 16px;margin-bottom:14px}.cards .card{margin:0}
.big{font-size:26px;font-weight:700;letter-spacing:.3px}.sub{color:var(--mu);font-size:12px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.wr{color:var(--wr)}
table{width:100%;border-collapse:collapse}th{color:var(--mu);font-weight:600;text-align:right;padding:8px;border-bottom:1px solid var(--ln);font-size:12px}
td{padding:8px;border-bottom:1px solid #1c2f33}tr:hover td{background:#192b30}
.pill{padding:2px 10px;border-radius:99px;font-size:12px;background:#1f3338}.pill.ok{background:#12372b}.pill.bad{background:#3c1f1d}.pill.wr{background:#3a2f14}
button.b{background:#1f3338;color:var(--tx);border:1px solid var(--ln);border-radius:7px;padding:5px 11px;font:inherit;cursor:pointer;margin-left:4px}
button.b:hover{border-color:var(--ac)}button.p{background:var(--ac);color:#04222b;border-color:var(--ac);font-weight:600}button.d:hover{border-color:var(--bad);color:var(--bad)}
input,select{background:#0e1a1d;color:var(--tx);border:1px solid var(--ln);border-radius:7px;padding:7px 10px;font:inherit;width:100%}
.bar{display:flex;gap:10px;margin-bottom:12px}.bar input{max-width:320px}label{display:block;margin:8px 0 3px;color:var(--mu);font-size:12px}
dialog{background:var(--pn);color:var(--tx);border:1px solid var(--ln);border-radius:12px;width:380px;padding:20px}dialog::backdrop{background:#000a}
canvas{width:100%;height:220px;display:block}.ltr{direction:ltr;unicode-bidi:embed}
@media(max-width:760px){body{flex-direction:column;height:100dvh}nav{width:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:6px;border:0;border-bottom:1px solid var(--ln);flex-shrink:0}nav b{display:none}nav button{white-space:nowrap;padding:8px 12px}nav button.on{box-shadow:inset 0 -3px var(--ac)}#st{margin:0 0 0 auto;padding:0 8px;white-space:nowrap;font-size:11px;max-width:38vw;overflow:hidden;text-overflow:ellipsis}#st br,#st button{display:none}main{padding:12px}.panel{overflow-x:auto}dialog{width:92vw}.bar{flex-wrap:wrap}.bar input{max-width:none}}
</style></head><body>
<nav><b>MikroTik Manager</b>
<button class=on data-t=dash>لوحة التحكم</button><button data-t=subs>المشتركون</button><button data-t=act>المتصلون الآن</button><button data-t=ev>الانقطاعات</button><button data-t=set>الإعدادات</button>
<div id=st></div></nav>
<main>
<section id=dash class=on><h2 id=hd>لوحة التحكم</h2>
<div class=cards><div class=card id=c1></div><div class=card id=c2></div><div class=card id=c3></div><div class=card id=c4></div></div>
<div class=panel><h3 id=ct>سرعة الإنترنت</h3><canvas id=cv></canvas></div>
<div class=panel><h3>آخر الأحداث</h3><table id=e5></table></div><div class=panel id=sys></div></section>
<section id=subs><h2>مشتركو PPPoE</h2><div class=bar><input id=q placeholder="بحث بالاسم أو الملاحظة أو IP" oninput=rs()><button class="b p" onclick=edit()>إضافة مشترك</button></div>
<div class=panel><table><thead><tr><th>الاسم<th>الباقة<th>الحالة<th>IP<th>ملاحظة<th></tr></thead><tbody id=sb></tbody></table></div></section>
<section id=act><h2>المتصلون الآن <span class=sub id=ac></span></h2><div class=panel><table><thead><tr><th>الاسم<th>IP<th>MAC<th>مدة الاتصال<th>تحميل<th>رفع<th></tr></thead><tbody id=ab></tbody></table></div></section>
<section id=ev><h2>سجل الاتصال والانقطاع</h2><div class=panel><table><thead><tr><th>الوقت<th>المشترك<th>الحدث<th>IP<th>MAC</tr></thead><tbody id=eb></tbody></table></div></section>
<section id=set><h2>الإعدادات</h2><div class=panel style=max-width:420px>
<label>عنوان الراوتر</label><input id=s_host class=ltr><label>منفذ API</label><input id=s_port class=ltr><label>اسم المستخدم</label><input id=s_user class=ltr>
<label>كلمة المرور (اتركها فارغة لعدم التغيير)</label><input id=s_password type=password class=ltr><label>واجهة الإنترنت WAN</label><select id=s_wan></select>
<label>عنوان فحص الإنترنت</label><input id=s_ping class=ltr><p><button class="b p" onclick=saveCfg()>حفظ وإعادة الاتصال</button></p>
<p class=sub>مرة واحدة على الراوتر (Terminal): <span class=ltr>/ip service set api disabled=no</span></p></div></section>
</main>
<dialog id=dlg><h2 id=dt></h2><label>الاسم</label><input id=f_name class=ltr><label>كلمة المرور</label><input id=f_password class=ltr><label>الباقة</label><select id=f_profile></select><label>ملاحظة</label><input id=f_comment>
<p><button class="b p" onclick=saveSub()>حفظ</button><button class=b onclick=dlg.close()>إلغاء</button></p></dialog>
<script>
const $=s=>document.querySelector(s),E=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const F=b=>b>=1e9?(b/1e9).toFixed(2)+' Gb/s':b>=1e6?(b/1e6).toFixed(1)+' Mb/s':b>=1e3?Math.round(b/1e3)+' Kb/s':Math.round(b)+' b/s';
let L={},T='dash',SUBS=[],EID=null,CF={};
function api(u,b){return new Promise((ok,no)=>setTimeout(()=>{try{const r=JSON.parse(Bridge.call(u,b?JSON.stringify(b):''));r.s==200?ok(r.b):no(Error((r.b&&r.b.error)||'خطأ'))}catch(e){no(e)}},0))}
const err=e=>alert('تعذر تنفيذ الطلب: '+e.message);
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{T=b.dataset.t;document.querySelectorAll('nav button,section').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('#'+T).classList.add('on');go()});
const evRow=e=>`<tr><td class=ltr>${e.t}<td>${E(e.name)}<td><span class="pill ${e.type=='up'?'ok':'bad'}">${e.type=='up'?'اتصل':'انقطع'}</span><td class=ltr>${E(e.ip)}<td class=ltr>${E(e.mac)}</tr>`;
function draw(){const c=$('#cv'),w=c.width=c.clientWidth*2,h=c.height=440,x=c.getContext('2d'),H=L.hist||[];x.clearRect(0,0,w,h);
const mx=Math.max(1e6,...H.map(p=>Math.max(p[0],p[1])))*1.15;x.font='20px Segoe UI';x.fillStyle='#86a1a2';x.strokeStyle='#253b40';x.lineWidth=1;
for(let i=0;i<=4;i++){const y=h-24-(h-40)*i/4;x.beginPath();x.moveTo(0,y);x.lineTo(w,y);x.stroke();x.fillText(F(mx*i/4),6,y-4)}
[[0,'#4cc9f0'],[1,'#f5b942']].forEach(([k,col])=>{x.beginPath();H.forEach((p,i)=>{const X=w-(H.length-1-i)*(w/119),Y=h-24-(h-40)*p[k]/mx;i?x.lineTo(X,Y):x.moveTo(X,Y)});x.strokeStyle=col;x.lineWidth=3;x.stroke()})}
function rDash(){const n=L.net||{};$('#c1').innerHTML=`<h3>حالة الإنترنت</h3><div class="big ${n.up?'ok':n.up===false?'bad':''}">${n.up?'متصل':n.up===false?'منقطع':'...'}</div><div class="sub ltr">${E(n.ms)} ← ${E(CF.ping||'')}</div>`;
$('#c2').innerHTML=`<h3>تحميل</h3><div class="big ltr" style=color:var(--ac)>${F(L.down||0)}</div>`;$('#c3').innerHTML=`<h3>رفع</h3><div class="big ltr" style=color:var(--wr)>${F(L.upl||0)}</div>`;
$('#c4').innerHTML=`<h3>المشتركون</h3><div class=big><span class=ok>${(L.active||[]).length}</span> <span class=sub>متصل من ${L.total||0}</span></div>`;
$('#ct').innerHTML=`سرعة الإنترنت - واجهة <b class=ltr>${E(L.wan||'؟')}</b> <span style=color:var(--ac)>● تحميل</span> <span style=color:var(--wr)>● رفع</span>`;draw();
$('#e5').innerHTML=(L.events||[]).slice(-6).reverse().map(evRow).join('')||'<tr><td class=sub>لا أحداث بعد. ستظهر هنا عند اتصال أي مشترك أو انقطاعه.';
$('#sys').innerHTML=`<h3>الراوتر</h3>${E(L.ident)} - ${E(L.board)} - RouterOS ${E(L.ver)} - تشغيل ${E(L.uptime)} - المعالج ${E(L.cpu)}% - الذاكرة ${L.mt?Math.round((L.mt-L.mf)/L.mt*100):0}%`}
function rAct(){const a=[...(L.active||[])].sort((x,y)=>y.down-x.down);$('#ac').textContent='('+a.length+')';
$('#ab').innerHTML=a.map(u=>`<tr><td><b>${E(u.name)}</b><td class=ltr>${E(u.ip)}<td class=ltr>${E(u.mac)}<td class=ltr>${E(u.uptime)}<td class=ltr>${F(u.down)}<td class=ltr>${F(u.up)}<td><button class="b d" onclick="kick('${E(u.name)}')">فصل</button></tr>`).join('')||'<tr><td colspan=7 class=sub>لا يوجد مشتركون متصلون.'}
function rEv(){$('#eb').innerHTML=(L.events||[]).slice().reverse().map(evRow).join('')||'<tr><td colspan=5 class=sub>لا أحداث بعد.'}
function rs(){const q=$('#q').value.toLowerCase();$('#sb').innerHTML=SUBS.filter(s=>(s.name+s.comment+s.ip).toLowerCase().includes(q)).map(s=>`<tr><td><b>${E(s.name)}</b><td>${E(s.profile)}<td><span class="pill ${s.disabled?'wr':s.online?'ok':'bad'}">${s.disabled?'معطل':s.online?'متصل':'غير متصل'}</span><td class=ltr>${E(s.ip)}<td>${E(s.comment)}
<td><button class=b onclick="edit('${s.id}')">تعديل</button><button class=b onclick="tog('${s.id}',${!s.disabled})">${s.disabled?'تفعيل':'تعطيل'}</button><button class="b d" onclick="del('${s.id}','${E(s.name)}')">حذف</button></tr>`).join('')}
async function loadSubs(){try{SUBS=await api('/api/secrets');rs()}catch(e){$('#sb').innerHTML='<tr><td colspan=6 class=bad>'+E(e.message)}}
async function edit(id){const s=SUBS.find(x=>x.id==id)||{};EID=id||null;$('#dt').textContent=id?'تعديل مشترك':'مشترك جديد';
try{const p=await api('/api/profiles');$('#f_profile').innerHTML=p.map(x=>`<option ${x==s.profile?'selected':''}>${E(x)}</option>`).join('')}catch(e){}
$('#f_name').value=s.name||'';$('#f_password').value=s.password||'';$('#f_comment').value=s.comment||'';dlg.showModal()}
async function saveSub(){const b={op:EID?'set':'add',id:EID,name:$('#f_name').value.trim(),password:$('#f_password').value,profile:$('#f_profile').value,comment:$('#f_comment').value};
if(!b.name)return alert('أدخل اسم المشترك');try{await api('/api/do',b);dlg.close();loadSubs()}catch(e){err(e)}}
async function tog(id,d){try{await api('/api/do',{op:'toggle',id,disable:d});loadSubs()}catch(e){err(e)}}
async function del(id,n){if(confirm('حذف المشترك '+n+' نهائيا؟'))try{await api('/api/do',{op:'remove',id});loadSubs()}catch(e){err(e)}}
async function kick(n){if(confirm('فصل '+n+'؟ سيعيد الاتصال تلقائيا.'))try{await api('/api/do',{op:'kick',name:n})}catch(e){err(e)}}
async function loadCfg(){CF=await api('/api/cfg');['host','port','user','ping'].forEach(k=>$('#s_'+k).value=CF[k]||'');
$('#s_wan').innerHTML=(L.ifaces||[]).map(i=>`<option ${i==CF.wan?'selected':''}>${E(i)}</option>`).join('')}
async function saveCfg(){const b={wan:$('#s_wan').value};['host','port','user','password','ping'].forEach(k=>b[k]=$('#s_'+k).value);await api('/api/cfg',b);alert('تم الحفظ. جارٍ إعادة الاتصال...');loadCfg()}
function go(){if(T=='subs')loadSubs();if(T=='set')loadCfg();paint()}
function paint(){const ok=L.ok;$('#st').innerHTML=ok?`<span class=ok>● متصل بالراوتر</span>`:`<span class=bad>● غير متصل</span><br>${E(L.err)}<br><button class=b onclick="document.querySelector('[data-t=set]').click()">الإعدادات</button>`;
if(T=='dash')rDash();if(T=='act')rAct();if(T=='ev')rEv()}
async function tick(){try{L=await api('/api/live');if(!CF.ping)CF=await api('/api/cfg');paint();if(T=='subs'&&!dlg.open&&!$('#q').value&&Date.now()%3<1)loadSubs()}catch(e){}setTimeout(tick,2000)}
tick();addEventListener('resize',()=>T=='dash'&&draw());
if(!L.ok)setTimeout(()=>{if(!L.ok&&!L.err.includes('جارٍ'))document.querySelector('[data-t=set]').click()},4000);
</script></body></html>
